<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DA Dashboard · Sales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap">
<link rel="stylesheet" href="../theme.css">
<style>
  .frow{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
  .frow button{background:var(--surface);border:1px solid var(--rule);border-radius:20px;padding:5px 13px;font-size:.83rem;color:var(--ink-2)}
  .frow button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
  .mtdtag{font-family:"IBM Plex Mono",monospace;font-size:8.5px;letter-spacing:.08em;background:var(--accent-soft);color:var(--accent);padding:1px 5px;border-radius:3px;font-weight:600}
  .frow button[aria-pressed="true"] .mtdtag{background:rgba(255,255,255,.22);color:var(--surface)}
  .hero{display:block;grid-template-columns:none}
  .hv{font-size:2.6rem;font-weight:600;letter-spacing:-.04em;line-height:1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
  .ht{font-size:.86rem;color:var(--muted)} .ht b{color:var(--ink);font-family:"IBM Plex Mono",monospace}
  .gauge{position:relative;height:12px;background:var(--surface-3);border-radius:3px;margin:12px 0 6px;max-width:560px}
  .gfill{height:100%;border-radius:3px}
  .gpace{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.6}
  .gl{display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);max-width:560px}
  .pace{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.05em;padding:2px 7px;border-radius:3px;font-weight:600;margin-top:8px}
  thead th.grp{text-align:center;border-bottom:1px solid var(--rule);background:var(--surface-3)}
  td.sw{width:12px;padding-right:0} td.sw i{display:inline-block;width:10px;height:10px;border-radius:2px}
  .mix{display:flex;height:22px;border-radius:4px;overflow:hidden;background:var(--surface-3);margin:4px 0 10px}
  .mix span{display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;font-size:10px;color:#fff;font-weight:600;overflow:hidden;white-space:nowrap}
  .tblwrap{overflow-x:auto}
  .trend{display:flex;align-items:flex-end;gap:10px;height:170px;margin-top:8px}
  .tcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;min-width:0}
  .tbar{width:100%;max-width:64px;border-radius:2px 2px 0 0}
  .tval{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600}
  .tlab{font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--muted);white-space:nowrap}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
  @media (max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}}
  .stat{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;box-shadow:var(--shadow)}
  .stat .sn{font-size:1.5rem;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
  .stat .sl{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:5px}
</style>

<div class="wrap" id="wrap" hidden>
  <div id="app"></div>
</div>

<script src="../optom-core.js"></script>
<script src="../kpi-data.js"></script>
<script src="../kpi-core.js"></script>
<script src="../shell.js"></script>
<script>
(function(){
  "use strict";
  var K = window.KPI, esc = SHELL.esc, fill = SHELL.fill, pct = K.pct;
  var wid = "";
  var L = {
    en:{ title:"Sales", sub:"{c} · member revenue vs target", asOf:"report as of", src:"Optometry Membership Weekly Report",
      note:"<b>Source:</b> the Optometry Membership Weekly Report, {w} (data cut-off {d}). Member revenue and target are month to date; the pace line marks how far through the month the cut-off is. Segment customer counts marked {cw} are carried from that week because the latest report has none.",
      hRev:"Member revenue MTD", achieved:"Achieved", target:"Target", ofTarget:"of target", onPace:"On pace", behind:"Slightly behind", offPace:"Behind", met:"Target met", missed:"Below target",
      sMembers:"Members", sNew:"New this week", sRevWk:"Revenue this week", sShare:"Share of clinic revenue",
      pSeg:"By segment", pSegH:"Month to date", thSeg:"Segment", thCust:"Customers", thRev:"Revenue", thShare:"% of revenue", thBill:"Avg bill", thTot:"Total",
      seg:{repurchase:"Repurchase", referral:"Referral", rescue:"Rescue"}, custFrom:"Customer counts as of {w}", mixH:"Revenue mix",
      pTrend:"Week by week", pTrendH:"Member revenue MTD per report week; the dashed line is that month's target", noData:"No report data for {c} yet.",
      months:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"] },
    vi:{ title:"Doanh số", sub:"{c} · doanh thu hội viên và mục tiêu", asOf:"báo cáo tính đến", src:"Báo cáo tuần Hội viên Khúc xạ",
      note:"<b>Nguồn:</b> Báo cáo tuần Hội viên Khúc xạ, {w} (chốt số {d}). Doanh thu hội viên và mục tiêu tính từ đầu tháng; vạch nhịp là vị trí ngày chốt trong tháng. Số khách đánh dấu {cw} lấy từ tuần đó vì báo cáo mới nhất chưa có.",
      hRev:"Doanh thu hội viên từ đầu tháng", achieved:"Đạt", target:"Mục tiêu", ofTarget:"mục tiêu", onPace:"Đúng nhịp", behind:"Hơi chậm", offPace:"Chậm", met:"Đạt mục tiêu", missed:"Dưới mục tiêu",
      sMembers:"Hội viên", sNew:"Mới tuần này", sRevWk:"Doanh thu tuần này", sShare:"Tỷ trọng trên doanh thu phòng khám",
      pSeg:"Theo nguồn", pSegH:"Từ đầu tháng", thSeg:"Nguồn", thCust:"Khách", thRev:"Doanh thu", thShare:"% doanh thu", thBill:"Bình quân/khách", thTot:"Tổng",
      seg:{repurchase:"Mua lại", referral:"Giới thiệu", rescue:"Giữ chân"}, custFrom:"Số khách tính đến {w}", mixH:"Cơ cấu doanh thu",
      pTrend:"Theo tuần", pTrendH:"Doanh thu hội viên từ đầu tháng theo tuần báo cáo; vạch đứt là mục tiêu tháng đó", noData:"Chưa có số báo cáo cho {c}.",
      months:["Th1","Th2","Th3","Th4","Th5","Th6","Th7","Th8","Th9","Th10","Th11","Th12"] },
    zh:{ title:"销售", sub:"{c} · 会员营收与目标", asOf:"周报截至", src:"视光会员周报",
      note:"<b>来源：</b>视光会员周报 {w}（数据截止 {d}）。会员营收与目标为本月至今；进度线为截止日在当月的位置。标注 {cw} 的客户数取自该周，因最新周报尚未填写。",
      hRev:"会员营收（本月至今）", achieved:"达成", target:"目标", ofTarget:"目标完成率", onPace:"进度正常", behind:"略落后", offPace:"落后", met:"已达标", missed:"未达标",
      sMembers:"会员", sNew:"本周新增", sRevWk:"本周营收", sShare:"占诊所营收比",
      pSeg:"按来源", pSegH:"本月至今", thSeg:"来源", thCust:"客户", thRev:"营收", thShare:"营收占比", thBill:"客单价", thTot:"合计",
      seg:{repurchase:"复购", referral:"转介绍", rescue:"挽回"}, custFrom:"客户数截至 {w}", mixH:"营收构成",
      pTrend:"逐周", pTrendH:"各周报的会员营收（本月至今）；虚线为当月目标", noData:"{c} 尚无周报数据。",
      months:["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"] }
  };
  function paceColour(pc){ return pc==="ok" ? "var(--ok)" : pc==="warn" ? "var(--warn)" : "var(--bad)"; }
  function paceText(t, pc, frac){ return frac<1 ? (pc==="ok"?t.onPace:pc==="warn"?t.behind:t.offPace) : (pc==="ok"?t.met:t.missed); }

  function render(st){
    var t = L[st.lang], cl = st.clinic, lang = st.lang;
    var all = K.weeks().filter(function(w){ return K.hosp(w, cl); });
    var w = all.filter(function(x){ return x.id === wid; })[0] || all[all.length-1];
    document.title = "DA Dashboard · " + t.title;
    SHELL.setTitle(t.title, esc(fill(t.sub, {c:cl})) + (w ? ' &middot; ' + esc(t.asOf) + ' ' + esc(K.fmtDay(w.cutoff, t.months)) : ''));
    if(!w){ document.getElementById("app").innerHTML = '<div class="panel"><div class="empty">'+esc(fill(t.noData, {c:cl}))+'</div></div>'; return; }
    var hp = K.hosp(w, cl), frac = w.frac, mon = t.months[+w.month.slice(5,7)-1];
    var h = '<div class="frow">' + all.map(function(x){
      return '<button data-w="'+x.id+'" aria-pressed="'+(x===w)+'">'+esc(x.id)+' <span class="mtdtag">'+esc(x.period)+'</span></button>'; }).join('') + '</div>';
    h += '<div class="note"><p>'+fill(t.note, {w:w.id, d:K.fmtDay(w.cutoff, t.months), cw: hp.custWeek ? "(" + hp.custWeek + ")" : "—"})+'</p></div>';

    var revA = hp.memberRevenue, revT = hp.targetRevenue, pc = K.paceClass(revA, revT, frac), p = pct(revA, revT);
    h += '<div class="hero"><div style="font-family:\'IBM Plex Mono\',monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600">'+esc(t.hRev)+' · '+esc(w.id)+' · '+esc(mon)+'</div>'
      + '<div class="hv">'+esc(K.money(revA, lang))+'</div><div class="ht"><b>'+esc(K.money(revA, lang))+'</b> / <b>'+esc(K.money(revT, lang))+'</b></div>'
      + '<div class="gauge"><div class="gfill" style="width:'+Math.min(100, Math.max(p,1))+'%;background:'+paceColour(pc)+'"></div>'+(frac<1 ? '<div class="gpace" style="left:'+Math.round(frac*100)+'%"></div>' : '')+'</div>'
      + '<div class="gl"><span>'+esc(t.achieved)+'</span><span>'+esc(t.target)+'</span></div>'
      + '<span class="pace p-'+(pc||'accent')+'">'+esc(paceText(t, pc, frac))+' · '+p+'% '+esc(t.ofTarget)+'</span></div>';

    var memWk = K.thisWeek(w, cl, function(x){ return x.members; }), revWk = K.thisWeek(w, cl, function(x){ return x.memberRevenue; });
    h += '<div class="stats">'
      + '<div class="stat"><div class="sn">'+hp.members.toLocaleString("en-US")+'</div><div class="sl">'+esc(t.sMembers)+'</div></div>'
      + '<div class="stat"><div class="sn" style="color:var(--ok)">'+(memWk>=0?"+":"")+memWk+'</div><div class="sl">'+esc(t.sNew)+'</div></div>'
      + '<div class="stat"><div class="sn">'+esc(K.money(revWk, lang))+'</div><div class="sl">'+esc(t.sRevWk)+'</div></div>'
      + '<div class="stat"><div class="sn">'+(hp.totalRevenue ? (Math.round(revA / hp.totalRevenue * 1000) / 10) + '%' : '—')+'</div><div class="sl">'+esc(t.sShare)+'</div></div>'
      + '</div>';

    var cols = ["var(--accent)","var(--ok)","var(--warn)"], segRev = 0, segCust = 0;
    K.SEGS.forEach(function(sg){ var x = hp.seg[sg] || {cust:0, rev:0}; segRev += x.rev; segCust += x.cust; });
    h += '<div class="panel"><h3><span>'+esc(t.pSeg)+'</span><span class="hint">'+esc(t.pSegH)+' · '+esc(w.id)+'</span></h3>'
      + '<div class="tblwrap"><table><thead><tr><th></th><th>'+esc(t.thSeg)+'</th><th class="n">'+esc(t.thCust)+'</th><th class="n">'+esc(t.thRev)+'</th><th class="n">'+esc(t.thShare)+'</th><th style="width:22%"></th><th class="n">'+esc(t.thBill)+'</th></tr></thead><tbody>';
    K.SEGS.forEach(function(sg, i){
      var x = hp.seg[sg] || {cust:0, rev:0}, sh = pct(x.rev, segRev);
      h += '<tr><td class="sw"><i style="background:'+cols[i]+'"></i></td><td><b>'+esc(t.seg[sg])+'</b></td><td class="n">'+(x.cust || '—')+'</td>'
        + '<td class="n">'+esc(K.money(x.rev, lang))+'</td><td class="n">'+sh+'%</td>'
        + '<td><div class="barw"><div class="barf" style="width:'+sh+'%;background:'+cols[i]+'"></div></div></td>'
        + '<td class="n">'+(x.cust ? esc(K.money(x.rev / x.cust, lang)) : '—')+'</td></tr>';
    });
    h += '<tr class="tot"><td></td><td>'+esc(t.thTot)+'</td><td class="n">'+(segCust || '—')+'</td><td class="n">'+esc(K.money(segRev, lang))+'</td><td class="n">100%</td><td></td><td class="n">'+(segCust ? esc(K.money(segRev / segCust, lang)) : '—')+'</td></tr></tbody></table></div>';
    if(hp.custWeek) h += '<div class="pad" style="padding-top:8px;padding-bottom:8px;font-size:.78rem;color:var(--muted)">'+esc(fill(t.custFrom, {w:hp.custWeek}))+'</div>';
    h += '<div class="pad" style="border-top:1px solid var(--rule-2)"><div style="font-size:.78rem;color:var(--muted)">'+esc(t.mixH)+'</div><div class="mix">';
    K.SEGS.forEach(function(sg, i){ var x = hp.seg[sg] || {rev:0}, wd = pct(x.rev, segRev); h += '<span style="width:'+wd+'%;background:'+cols[i]+'">'+(wd >= 12 ? wd+'%' : '')+'</span>'; });
    h += '</div><div class="legend">'+K.SEGS.map(function(sg, i){ return '<span><i style="background:'+cols[i]+'"></i>'+esc(t.seg[sg])+' '+esc(K.money((hp.seg[sg]||{rev:0}).rev, lang))+'</span>'; }).join('')+'</div></div></div>';

    /* trend across report weeks */
    var mx = 1; all.forEach(function(x){ var y = K.hosp(x, cl); mx = Math.max(mx, y.memberRevenue, y.targetRevenue); });
    h += '<div class="panel"><h3><span>'+esc(t.pTrend)+'</span><span class="hint">'+esc(t.pTrendH)+'</span></h3><div class="pad"><div class="trend">';
    all.forEach(function(x){
      var y = K.hosp(x, cl), hb = Math.max(3, Math.round(y.memberRevenue / mx * 130)), th = Math.round(y.targetRevenue / mx * 130), pcx = K.paceClass(y.memberRevenue, y.targetRevenue, x.frac);
      h += '<div class="tcol"><span class="tval">'+esc(K.money(y.memberRevenue, lang))+'</span>'
        + '<div style="position:relative;width:100%;max-width:64px;height:'+(Math.max(hb, th)+3)+'px"><div class="tbar" style="position:absolute;left:0;right:0;bottom:0;height:'+hb+'px;background:'+(x===w ? paceColour(pcx) : 'var(--surface-3)')+'"></div>'
        + '<div style="position:absolute;left:0;right:0;bottom:'+th+'px;border-top:2px dashed var(--ink);opacity:.5"></div></div>'
        + '<span class="tlab">'+esc(x.id)+' · '+esc(t.months[+x.month.slice(5,7)-1])+'</span></div>';
    });
    h += '</div></div></div>';
    document.getElementById("app").innerHTML = h;
    document.querySelectorAll("[data-w]").forEach(function(b){ b.onclick = function(){ wid = b.dataset.w; SHELL.render(); }; });
  }
  SHELL.init({ page:"sales", root:"../", onRender:render });
})();
</script>
