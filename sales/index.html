<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DA Dashboard · Sales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap">
<link rel="stylesheet" href="../theme.css">
<style>
  .frow{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
  .frow button{background:var(--surface);border:1px solid var(--rule);border-radius:20px;padding:5px 13px;font-size:.83rem;color:var(--ink-2)}
  .frow button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
  .mtdtag{font-family:"IBM Plex Mono",monospace;font-size:8.5px;letter-spacing:.08em;background:var(--accent-soft);color:var(--accent);padding:1px 5px;border-radius:3px;font-weight:600}
  .frow button[aria-pressed="true"] .mtdtag{background:rgba(255,255,255,.22);color:var(--surface)}
  .hero{display:block;grid-template-columns:none}
  .hv{font-size:2.6rem;font-weight:600;letter-spacing:-.04em;line-height:1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
  .ht{font-size:.86rem;color:var(--muted)} .ht b{color:var(--ink);font-family:"IBM Plex Mono",monospace}
  .gauge{position:relative;height:12px;background:var(--surface-3);border-radius:3px;margin:12px 0 6px;max-width:560px}
  .gfill{height:100%;border-radius:3px}
  .gpace{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.6}
  .gl{display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);max-width:560px}
  .pace{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.05em;padding:2px 7px;border-radius:3px;font-weight:600;margin-top:8px}
  thead th.grp{text-align:center;border-bottom:1px solid var(--rule);background:var(--surface-3)}
  td.sw{width:12px;padding-right:0} td.sw i{display:inline-block;width:10px;height:10px;border-radius:2px}
  .mix{display:flex;height:22px;border-radius:4px;overflow:hidden;background:var(--surface-3);margin:4px 0 10px}
  .mix span{display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;font-size:10px;color:#fff;font-weight:600;overflow:hidden;white-space:nowrap}
  .tblwrap{overflow-x:auto}
</style>

<div class="wrap" id="wrap" hidden>
  <div id="app"></div>
</div>

<script src="../optom-core.js"></script>
<script src="../kpi-core.js"></script>
<script src="../shell.js"></script>
<script>
(function(){
  "use strict";
  var K = window.KPI, esc = SHELL.esc, fill = SHELL.fill, pct = K.pct;
  var month = "";
  var L = {
    en:{ title:"Sales", sub:"{c} · target vs achieved", asOf:"as of", dayOf:"day {d} of {n}", mtd:"MTD", mock:"modelled",
      note:"<b>Placeholder.</b> Targets are illustrative and the achieved figures are modelled from them. Replace the TARGETS block in kpi-core.js with the clinic's real monthly targets and point actuals() at the sales tracker.",
      hRev:"Revenue", achieved:"Achieved", target:"Target", ofTarget:"of target", onPace:"On pace", behind:"Slightly behind", offPace:"Behind", met:"Target met", missed:"Below target",
      pStreams:"By stream", pStreamsH:"Revenue and customers", thStream:"Stream", thRevenue:"Revenue", thCustomers:"Customers", thTarget:"Target", thAch:"Achieved", thPct:"%", thTot:"Total",
      st:{member:"Membership", repurchase:"Repurchase", referral:"Referral"}, mixH:"Revenue mix, achieved", noTargets:"No targets set for this clinic yet.",
      months:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"] },
    vi:{ title:"Doanh số", sub:"{c} · mục tiêu và đạt được", asOf:"tính đến", dayOf:"ngày {d} / {n}", mtd:"Đến nay", mock:"mô phỏng",
      note:"<b>Số giữ chỗ.</b> Mục tiêu là số minh hoạ và số đạt được là mô phỏng từ đó. Thay khối TARGETS trong kpi-core.js bằng mục tiêu tháng thật của phòng khám và nối actuals() với bảng doanh số.",
      hRev:"Doanh thu", achieved:"Đạt", target:"Mục tiêu", ofTarget:"mục tiêu", onPace:"Đúng nhịp", behind:"Hơi chậm", offPace:"Chậm", met:"Đạt mục tiêu", missed:"Dưới mục tiêu",
      pStreams:"Theo nguồn", pStreamsH:"Doanh thu và số khách", thStream:"Nguồn", thRevenue:"Doanh thu", thCustomers:"Khách hàng", thTarget:"Mục tiêu", thAch:"Đạt", thPct:"%", thTot:"Tổng",
      st:{member:"Hội viên", repurchase:"Mua lại", referral:"Giới thiệu"}, mixH:"Cơ cấu doanh thu đạt được", noTargets:"Phòng khám này chưa có mục tiêu.",
      months:["Th1","Th2","Th3","Th4","Th5","Th6","Th7","Th8","Th9","Th10","Th11","Th12"] },
    zh:{ title:"销售", sub:"{c} · 目标与达成", asOf:"截至", dayOf:"第 {d} / {n} 天", mtd:"本月至今", mock:"模拟",
      note:"<b>占位数。</b>目标为示意值，达成数由其模拟生成。将 kpi-core.js 中的 TARGETS 块替换为诊所的真实月度目标，并把 actuals() 接到销售追踪表。",
      hRev:"营收", achieved:"达成", target:"目标", ofTarget:"目标完成率", onPace:"进度正常", behind:"略落后", offPace:"落后", met:"已达标", missed:"未达标",
      pStreams:"按来源", pStreamsH:"营收与客户数", thStream:"来源", thRevenue:"营收", thCustomers:"客户", thTarget:"目标", thAch:"达成", thPct:"%", thTot:"合计",
      st:{member:"会员", repurchase:"复购", referral:"转介绍"}, mixH:"达成营收构成", noTargets:"该诊所尚未设置目标。",
      months:["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"] }
  };
  function paceColour(pc){ return pc==="ok" ? "var(--ok)" : pc==="warn" ? "var(--warn)" : "var(--bad)"; }
  function monthLabel(t, k){ return t.months[+k.slice(5,7)-1] + " " + k.slice(0,4); }

  function render(st){
    var t = L[st.lang], TODAY = st.today, cur = TODAY.slice(0,7), cl = st.clinic;
    if(!month) month = cur;
    var frac = K.monthFrac(month, TODAY);
    document.title = "DA Dashboard · " + t.title;
    SHELL.setTitle(t.title, esc(fill(t.sub, {c:cl})) + ' &middot; ' + esc(t.asOf) + ' ' + esc(TODAY));

    var h = '<div class="frow">' + K.months(TODAY).map(function(m){
      return '<button data-m="'+m+'" aria-pressed="'+(m===month)+'">'+esc(monthLabel(t, m))+(m===cur ? ' <span class="mtdtag">'+esc(t.mtd)+'</span>' : '')+'</button>'; }).join('') + '</div>';
    h += '<div class="note"><p>'+t.note+'</p></div>';

    var tg = K.targets(cl), ac = K.actuals(cl, month, TODAY);
    if(!tg){ h += '<div class="panel"><div class="empty">'+esc(t.noTargets)+'</div></div>'; document.getElementById("app").innerHTML = h; wire(); return; }
    var revT = 0, revA = 0, cusT = 0, cusA = 0, rows = [];
    K.STREAMS.forEach(function(s){ var r = { st:s, rt:tg.rev[s], ra:ac.rev[s], ct:tg.cust[s], ca:ac.cust[s] }; revT += r.rt; revA += r.ra; cusT += r.ct; cusA += r.ca; rows.push(r); });
    var pc = K.paceClass(revA, revT, frac), p = pct(revA, revT);
    h += '<div class="hero"><div class="kl" style="font-family:\'IBM Plex Mono\',monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600">'+esc(t.hRev)+' <span class="pill p-mock">'+esc(t.mock)+'</span>'
      + (frac < 1 ? ' · '+esc(fill(t.dayOf, {d:+TODAY.slice(8,10), n:K.daysIn(month)})) : '')+'</div>'
      + '<div class="hv">'+esc(K.money(revA, st.lang))+'</div><div class="ht"><b>'+esc(K.money(revA, st.lang))+'</b> / <b>'+esc(K.money(revT, st.lang))+'</b></div>'
      + '<div class="gauge"><div class="gfill" style="width:'+Math.min(100, Math.max(p,1))+'%;background:'+paceColour(pc)+'"></div>'+(frac<1 ? '<div class="gpace" style="left:'+Math.round(frac*100)+'%"></div>' : '')+'</div>'
      + '<div class="gl"><span>'+esc(t.achieved)+'</span><span>'+esc(t.target)+'</span></div>'
      + '<span class="pace p-'+(pc||'accent')+'">'+esc(frac<1 ? (pc==="ok"?t.onPace:pc==="warn"?t.behind:t.offPace) : (pc==="ok"?t.met:t.missed))+' · '+p+'% '+esc(t.ofTarget)+'</span></div>';

    var cols = ["var(--accent)","var(--ok)","var(--warn)"];
    h += '<div class="panel"><h3><span>'+esc(t.pStreams)+' <span class="pill p-mock">'+esc(t.mock)+'</span></span><span class="hint">'+esc(t.pStreamsH)+'</span></h3>'
      + '<div class="tblwrap"><table><thead><tr><th rowspan="2"></th><th rowspan="2">'+esc(t.thStream)+'</th>'
      + '<th class="grp" colspan="4">'+esc(t.thRevenue)+'</th><th class="grp" colspan="3">'+esc(t.thCustomers)+'</th></tr>'
      + '<tr><th class="n">'+esc(t.thTarget)+'</th><th class="n">'+esc(t.thAch)+'</th><th class="n">'+esc(t.thPct)+'</th><th style="width:18%"></th>'
      + '<th class="n">'+esc(t.thTarget)+'</th><th class="n">'+esc(t.thAch)+'</th><th class="n">'+esc(t.thPct)+'</th></tr></thead><tbody>';
    rows.forEach(function(r, i){
      var rp = pct(r.ra, r.rt), rpc = K.paceClass(r.ra, r.rt, frac);
      h += '<tr><td class="sw"><i style="background:'+cols[i]+'"></i></td><td><b>'+esc(t.st[r.st])+'</b></td>'
        + '<td class="n">'+esc(K.money(r.rt, st.lang))+'</td><td class="n">'+esc(K.money(r.ra, st.lang))+'</td><td class="n" style="color:'+paceColour(rpc)+'">'+rp+'%</td>'
        + '<td><div class="barw"><div class="barf" style="width:'+Math.min(100,rp)+'%;background:'+cols[i]+'"></div>'+(frac<1 ? '<div class="bart" style="left:'+Math.round(frac*100)+'%"></div>' : '')+'</div></td>'
        + '<td class="n">'+r.ct+'</td><td class="n">'+r.ca+'</td><td class="n">'+pct(r.ca, r.ct)+'%</td></tr>';
    });
    h += '<tr class="tot"><td></td><td>'+esc(t.thTot)+'</td><td class="n">'+esc(K.money(revT, st.lang))+'</td><td class="n">'+esc(K.money(revA, st.lang))+'</td><td class="n">'+pct(revA, revT)+'%</td><td></td>'
      + '<td class="n">'+cusT+'</td><td class="n">'+cusA+'</td><td class="n">'+pct(cusA, cusT)+'%</td></tr></tbody></table></div>'
      + '<div class="pad" style="border-top:1px solid var(--rule-2)"><div style="font-size:.78rem;color:var(--muted)">'+esc(t.mixH)+'</div><div class="mix">';
    rows.forEach(function(r, i){ var w = pct(r.ra, revA); h += '<span style="width:'+w+'%;background:'+cols[i]+'">'+(w >= 12 ? w+'%' : '')+'</span>'; });
    h += '</div><div class="legend">'+rows.map(function(r, i){ return '<span><i style="background:'+cols[i]+'"></i>'+esc(t.st[r.st])+' '+esc(K.money(r.ra, st.lang))+'</span>'; }).join('')+'</div></div></div>';
    document.getElementById("app").innerHTML = h;
    wire();
  }
  function wire(){ document.querySelectorAll("[data-m]").forEach(function(b){ b.onclick = function(){ month = b.dataset.m; SHELL.render(); }; }); }
  SHELL.init({ page:"sales", root:"../", onRender:render });
})();
</script>
