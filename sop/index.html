(function(){
  "use strict";

  /* Data, feed rules and the modelled sent-marks are shared with the
     head-office page through ../optom-core.js, so a customer scores the
     same here as there. */
  var Z = window.ZSOP, DATA = Z.DATA;
  var STAGES = Z.STAGES, OFF = Z.OFF, CAD = Z.CAD, PRODUCTS = Z.PRODUCTS, FLAGS = Z.FLAGS;
  var CASES = DATA.cases, SNAPSHOT = DATA.cases;
  var TODAY = Z.todayISO(), START = Z.START, TARGET = Z.TARGET, MS = Z.MS;
  var PAGE = 10;

  var lang = "en", me = "";
    var feedState = { mode:"snapshot", at:DATA.generated || "", error:"" };

  /* Open-query ledger. QUERIES.url is the Apps Script web app deployed from
     tools/chat-queries.gs (token must match). Until it is set, the panel
     shows a modelled sample drawn per Zalo tag. */
  var QUERIES = { url: "", token: "change-me" };
  var queryRows = null;              /* live rows from the ledger, else null */
  var SHORT = 5;
  function freshUi(){ return { today:{q:"",status:"",prod:""}, flags:{q:"",type:"",prod:"",shown:SHORT},
    missed:{q:"",status:"",prod:"",cad:"",shown:SHORT,older:false}, reply:{q:"",status:"",cat:"",shown:SHORT} }; }
  var ui = freshUi();

  function store(k, v){
    try{
      if(v === undefined) return localStorage.getItem(k) || "";
      if(v === null) localStorage.removeItem(k); else localStorage.setItem(k, v);
    }catch(e){}
    return v;
  }
  function T(){ return L[lang]; }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function pct(a,b){ return b ? Math.round(a/b*100) : 0; }
  function fill(s, o){ Object.keys(o).forEach(function(k){ s = s.split("{"+k+"}").join(o[k]); }); return s; }
  function addDays(iso, n){ return Z.addDays(iso, n); }
  function mondayOf(iso){
    var d = new Date(Date.parse(iso)), wd = (d.getUTCDay() + 6) % 7;
    return new Date(d.getTime() - wd*MS).toISOString().slice(0,10);
  }
  function fmtDay(iso){ var t = T(); return +iso.slice(8,10) + " " + t.months[+iso.slice(5,7)-1]; }
  function fmtWhen(iso){
    if(!iso) return "";
    var t = T(), d = new Date(iso);
    if(isNaN(d)) return iso;
    var day = d.getDate() + " " + t.months[d.getMonth()];
    return iso.length > 10 ? day + " " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0") : day;
  }
  function daysBetween(a, b){ return Math.round((Date.parse(b) - Date.parse(a)) / MS); }
  function scoreColour(s){ return s>=TARGET ? "var(--ok)" : s>=70 ? "var(--warn)" : "var(--bad)"; }
  function scoreClass(s){ return s>=TARGET ? "ok" : s>=70 ? "warn" : "bad"; }

  /* ---------------- cadence per case (same rules as the head-office page) ---------------- */
  function defs(c, si){ return CAD[c[2]][STAGES[si]] || null; }
  function dueDate(c, si){
    var anchor = OFF[si][0] === 0 ? c[4] : c[5];
    return anchor ? addDays(anchor, OFF[si][1]) : null;
  }
  /* Due date is the END of a cadence's window. Windowed cadences open
     earlier (D6-7 on day 6, CD+3-5 on day 3). */
  function windowStart(c, si){
    var d = dueDate(c, si), s = Z.WINDOW_START[STAGES[si]];
    return (d && s !== undefined) ? addDays(d, s - OFF[si][1]) : d;
  }
  function cpAt(c, si, i){ return c[8][si].charAt(i) === "1"; }
  function cadencePoints(c, si){
    var bits = c[8][si], got = 0;
    for(var i=0;i<bits.length;i++) if(bits.charAt(i)==="1") got++;
    if(got === 0) return 0;
    return got === bits.length ? 1 : 0.5;
  }
  function daKey(c){ return c[0] + "│" + c[1]; }
  function daName(k){ return k.split("│")[1]; }
  function daClinic(k){ return k.split("│")[0]; }
  function prodLabel(p){ return T().prod[p] || p; }

  /* Every cadence instance of a set of cases from July onward, with its
     due date and score. No upper bound: future instances are what the
     week view and the "due today" list are made of. */
  function instancesOf(cases){
    var out = [];
    cases.forEach(function(c){
      for(var si=0; si<STAGES.length; si++){
        if(!defs(c, si)) continue;
        var d = dueDate(c, si);
        if(!d || d < START) continue;
        out.push({ c:c, si:si, d:d, pts:cadencePoints(c, si) });
      }
    });
    return out;
  }
  function agg(list){
    var pts=0, full=0, part=0, miss=0;
    list.forEach(function(x){ pts += x.pts; if(x.pts===1) full++; else if(x.pts===0.5) part++; else miss++; });
    return { due:list.length, pts:pts, score:pct(pts, list.length), full:full, part:part, miss:miss };
  }
  function itemsOf(list){
    var n=0, sent=0;
    list.forEach(function(x){ var bits = x.c[8][x.si]; n += bits.length;
      for(var i=0;i<bits.length;i++) if(bits.charAt(i)==="1") sent++; });
    return { n:n, sent:sent };
  }
  function missingItems(x){
    var d = defs(x.c, x.si), out = [];
    for(var i=0;i<d.length;i++) if(!cpAt(x.c, x.si, i)) out.push(d[i][0]);
    return out;
  }

  /* ---------------- the DA's numbers ---------------- */
  function build(){
    var mine = CASES.filter(function(c){ return daKey(c) === me; });
    var inst = instancesOf(mine);
    var curM = TODAY.slice(0,7), mon = mondayOf(TODAY), sun = addDays(mon, 6);
    var today = inst.filter(function(x){ return x.d === TODAY; });
    var week = inst.filter(function(x){ return x.d >= mon && x.d <= sun; });
    var closed = inst.filter(function(x){ return x.d < TODAY; });
    var mtd = closed.filter(function(x){ return x.d.slice(0,7) === curM; });
    var missed = closed.filter(function(x){ return x.pts < 1; })
      .sort(function(a,b){ return a.d < b.d ? 1 : a.d > b.d ? -1 : a.pts - b.pts; });
    var tomorrow = inst.filter(function(x){ return x.d === addDays(TODAY, 1); });
    /* the missed list opens on this week and last; older misses sit behind a button */
    var lastMon = addDays(mon, -7);
    var missedRecent = missed.filter(function(x){ return x.d >= lastMon; });
    var missedOlder = missed.filter(function(x){ return x.d < lastMon; });

    /* day by day: score per closed day, live completion today */
    var byDay = {};
    inst.forEach(function(x){ (byDay[x.d] = byDay[x.d] || []).push(x); });
    function dayScore(d){ var l = byDay[d]; return l && l.length ? agg(l).score : null; }

    /* streak: consecutive days at or above target, ending yesterday
       (today joins once it is complete). Days with nothing due are skipped. */
    var streak = 0, best = 0, run = 0, d;
    for(d = START; d < TODAY; d = addDays(d, 1)){
      var s = dayScore(d);
      if(s === null) continue;
      if(s >= TARGET){ run++; if(run > best) best = run; } else run = 0;
    }
    streak = run;
    var tA = agg(today);
    if(today.length && tA.score === 100){ streak++; if(streak > best) best = streak; }
    var perfect = 0;
    for(d = curM + "-01"; d < TODAY; d = addDays(d, 1)) if(dayScore(d) === 100) perfect++;
    if(today.length && tA.score === 100) perfect++;

    return {
      mine:mine, inst:inst, today:today, week:week, closed:closed, mtd:mtd, missed:missed, tomorrow:tomorrow,
      missedRecent:missedRecent, missedOlder:missedOlder, lastMon:lastMon,
      mon:mon, sun:sun, curM:curM, byDay:byDay, dayScore:dayScore,
      streak:streak, best:best, perfect:perfect,
      flags: mine.filter(function(c){ return c[7].length; }),
      replies: replyQueue(mine)
    };
  }

  /* Open queries for this DA. Live rows come from the ledger (tools/
     chat-queries.gs): every real question or request a customer raised,
     tracked until a real answer lands. Without the ledger a deterministic
     MODELLED sample is drawn per Zalo tag: category and status only, no
     message text is invented. */
  var QCATS = ["price","delivery","appointment","usage","complaint","product","other"];
  function replyQueue(mine){
    var now = Date.parse(TODAY + "T18:00:00"), out = [];
    if(queryRows){
      queryRows.forEach(function(q){
        if(q.da !== daName(me) || q.clinic !== daClinic(me)) return;
        var hours = Math.max(0, Math.round((now - Date.parse(q.askedAt)) / 36e5));
        out.push({ tag:q.tag, prod:"", cat:q.category, status:q.status, hours:hours, query:q.query,
                   chased:q.chased || 0, responseHours:q.responseHours, resolvedAt:q.resolvedAt });
      });
    } else {
      mine.forEach(function(c){
        if(!c[4] && !c[5]) return;
        var r = Z.prng(Z.hash32("reply│" + c[0] + "│" + c[6]));
        if(r() > 0.07) return;
        var t = r(), status = t < 0.45 ? "open" : t < 0.7 ? "promised" : t < 0.82 ? "chased" : "resolved";
        var hours = 1 + Math.floor(r() * 96), cat = QCATS[Math.floor(r() * QCATS.length)];
        out.push({ tag:c[6], prod:c[2], cat:cat, status:status, hours:hours, query:"",
                   chased: status === "chased" ? 1 + Math.floor(r()*2) : 0,
                   responseHours: status === "resolved" ? Math.round(r() * 30 * 10) / 10 : "",
                   resolvedAt: status === "resolved" ? addDays(TODAY, -Math.floor(r()*6)) : "" });
      });
    }
    var openQ = out.filter(function(q){ return q.status !== "resolved" && q.status !== "dismissed"; })
      .sort(function(a,b){ return (b.status==="chased") - (a.status==="chased") || b.hours - a.hours; });
    var done = out.filter(function(q){ return q.status === "resolved"; });
    var hrs = done.map(function(q){ return +q.responseHours; }).filter(function(v){ return !isNaN(v); }).sort(function(a,b){ return a-b; });
    return { open:openQ, resolved:done.length, medianHours: hrs.length ? hrs[Math.floor(hrs.length/2)] : null,
             promised: openQ.filter(function(q){ return q.status === "promised"; }).length,
             chased: openQ.filter(function(q){ return q.status === "chased"; }).length };
  }
  function loadQueries(){
    if(!QUERIES.url) return Promise.resolve(false);
    var u = QUERIES.url + (QUERIES.url.indexOf("?") === -1 ? "?" : "&") + "token=" + encodeURIComponent(QUERIES.token) + "&t=" + Date.now();
    return fetch(u).then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function(j){ if(j.error) throw new Error(j.error); queryRows = j.queries || []; return true; })
      .catch(function(){ queryRows = null; return false; });
  }
  function waitText(h){
    var t = T();
    return h < 24 ? fill(t.hours, {n:h}) : fill(t.daysUnit, {n:Math.floor(h/24)});
  }

  function cpName(k){ return CP[lang][k] || k; }

  /* ================= pieces ================= */
  function ring(p, colour, label, sub, small){
    var r = 44, C = 2*Math.PI*r, v = Math.max(0, Math.min(100, p));
    return '<div class="ring'+(small?' sm':'')+'"><svg viewBox="0 0 100 100">'
      + '<circle cx="50" cy="50" r="'+r+'" fill="none" stroke="var(--surface-3)" stroke-width="9"/>'
      + '<circle cx="50" cy="50" r="'+r+'" fill="none" stroke="'+colour+'" stroke-width="9" stroke-linecap="round" '
      + 'stroke-dasharray="'+(C*v/100).toFixed(1)+' '+C.toFixed(1)+'"/></svg>'
      + '<div class="rv"><b>'+esc(label)+'</b>'+(sub?'<span>'+esc(sub)+'</span>':'')+'</div></div>';
  }
  function statusOf(x){ return x.pts === 1 ? "done" : x.pts === 0.5 ? "prog" : "todo"; }
  function taskRow(x, opts){
    var t = T(), d = defs(x.c, x.si), st = statusOf(x), chips = "";
    for(var i=0;i<d.length;i++){
      var sent = cpAt(x.c, x.si, i);
      chips += '<span class="it'+(sent?' sent':'')+'"><i>'+(sent?'✓':'○')+'</i>'+esc(cpName(d[i][0]))+'</span>';
    }
    var ws = windowStart(x.c, x.si), meta = '<span class="pill p-prod">'+esc(prodLabel(x.c[2]))+'</span>'
      + '<span class="mono">'+esc(STAGES[x.si])+'</span>';
    if(opts && opts.due) meta += '<span>'+esc(fill(t.dueOn, {d:fmtDay(x.d)}))+'</span>'
      + '<span style="color:var(--bad)">'+esc(fill(t.overdue, {n:daysBetween(x.d, TODAY)}))+'</span>';
    else if(ws && ws !== x.d) meta += '<span>'+esc(fill(t.winOpen, {d:fmtDay(ws)}))+'</span>';
    var pill = (opts && opts.due)
      ? (x.pts===0 ? '<span class="pill p-bad">'+esc(t.stMissed)+'</span>' : '<span class="pill p-warn">'+esc(t.stIncomplete)+'</span>')
      : (st==="done" ? '<span class="pill p-ok">'+esc(t.stDone)+'</span>'
         : st==="prog" ? '<span class="pill p-warn">'+esc(t.stProg)+'</span>'
         : '<span class="pill p-accent">'+esc(t.stTodo)+'</span>');
    return '<div class="task'+(st==="done"&&!(opts&&opts.due)?' done':'')+'">'
      + '<div class="tag">'+esc(x.c[6])+'</div><div class="st">'+pill+'</div>'
      + '<div class="meta">'+meta+'</div><div class="items">'+chips+'</div></div>';
  }

  /* ================= render ================= */
  function render(){
    var t = T(), b = build();
    document.title = "ZALO SOP · " + t.title;
    SHELL.setTitle(fill(t.hello, {n:daName(me)}), '<b>'+esc(daClinic(me))+'</b> &middot; '+esc(t.sub)+' &middot; '+esc(t.asOf)+' '+esc(TODAY));

    var h = "", tA = agg(b.today), items = itemsOf(b.today);
    var wClosed = b.week.filter(function(x){ return x.d < TODAY; }).length;
    var wFuture = b.week.filter(function(x){ return x.d > TODAY; }).length;
    var perfect = b.today.length > 0 && tA.full === b.today.length;

    /* stat tiles */
    h += '<div class="stats">'
      + tile("#today", b.today.length ? (perfect ? "ok" : "acc") : "", b.today.length, t.sToday, fill(t.sTodayX, {d:tA.full, r:b.today.length - tA.full}))
      + tile("#week", "", b.week.length, t.sWeek, fill(t.sWeekX, {a:wClosed, b:wFuture}))
      + tile("#missed", b.missedRecent.length ? "bad" : "ok", b.missedRecent.length, t.sMissed, fill(t.sMissedX, {n:b.missedOlder.length}))
      + tile("#reply", b.replies.open.length ? "warn" : "ok", b.replies.open.length, t.sReply, queryRows ? t.sReplyLive : t.sReplyX)
      + tile("#flags", b.flags.length ? "warn" : "ok", b.flags.length, t.sFlags, t.sFlagsX)
      + '</div>';

    /* hero: today */
    h += '<div class="hero'+(perfect?' perfect':'')+'" id="top">';
    if(b.today.length){
      var donePct = pct(tA.full, b.today.length);
      h += ring(donePct, perfect ? 'var(--ok)' : 'var(--accent)', donePct+'%', t.hDone)
        + '<div><h2>'+esc(t.hTitle)+'</h2>'
        + '<p>'+fill(t.hLine, {d:tA.full, n:b.today.length, p:tA.part, z:tA.miss})+'</p>'
        + '<div class="msgbar"><span style="width:'+pct(items.sent, items.n)+'%"></span></div>'
        + '<div class="msgtxt">'+esc(fill(t.hMsgs, {a:items.sent, b:items.n}))+'</div>'
        + '<span class="cta">'+esc(perfect ? t.hPerfect : fill(t.hToGo, {n:b.today.length - tA.full}))+'</span></div>';
    } else {
      h += ring(0, 'var(--surface-3)', '—', t.rToday)
        + '<div><h2>'+esc(t.hNone)+'</h2><p>'+esc(t.hNoneHint)+'</p></div>';
    }
    h += '</div>';

    /* ---- work first: today, flags, missed, open queries ---- */
    var prods = function(list, get){ var p = {}; list.forEach(function(x){ p[get(x)] = (p[get(x)]||0)+1; }); return PRODUCTS.filter(function(k){ return p[k]; }).map(function(k){ return [k, prodLabel(k), p[k]]; }); };
    var qmatch = function(q, tag){ return !q || tag.toLowerCase().indexOf(q.trim().toLowerCase()) !== -1; };

    /* today list: full length, filter by status / product / search */
    var f = ui.today, todayRows = b.today.slice().sort(function(a,b2){ return a.pts - b2.pts || (a.c[6] < b2.c[6] ? -1 : 1); });
    var cnt = { todo:0, prog:0, done:0 }; todayRows.forEach(function(x){ cnt[statusOf(x)]++; });
    var shown = todayRows.filter(function(x){ return (!f.status || statusOf(x) === f.status) && (!f.prod || x.c[2] === f.prod) && qmatch(f.q, x.c[6]); });
    h += '<div class="panel" id="today"><h3><span>'+esc(t.pToday)+' <span class="pill '+(b.today.length ? (perfect ? "p-ok" : "p-accent") : "p-inert")+'">'+b.today.length+'</span></span><span class="hint">'+esc(t.pTodayH)+'</span></h3>';
    if(b.today.length){
      h += fbar("today", f, { q:true, chips:[ {key:"status", items:[["todo", t.fTodo, cnt.todo], ["prog", t.fProg, cnt.prog], ["done", t.fDone, cnt.done]]},
                                                {key:"prod", items:prods(todayRows, function(x){ return x.c[2]; })} ], count:[shown.length, todayRows.length] });
      if(shown.length) shown.forEach(function(x){ h += taskRow(x); });
      else h += '<div class="empty">'+esc(t.nothingLeft)+'</div>';
    } else h += '<div class="empty">'+esc(t.hNone)+'</div>';
    h += '<div class="tmrw">'+fill(t.tomorrow, {n:b.tomorrow.length})+'</div></div>';

    /* data flags: high up, filter by type / product / search, short pages */
    f = ui.flags;
    var fl = b.flags.slice().sort(function(x,y){ return y[7].length - x[7].length || (x[6] < y[6] ? -1 : 1); });
    var flCounts = {}; fl.forEach(function(c){ c[7].forEach(function(k){ flCounts[k] = (flCounts[k]||0)+1; }); });
    var flRows = fl.filter(function(c){ return (!f.type || c[7].indexOf(f.type) !== -1) && (!f.prod || c[2] === f.prod) && qmatch(f.q, c[6]); });
    h += '<div class="panel" id="flags"><h3><span>'+esc(t.pFlags)+' <span class="pill '+(fl.length?'p-warn':'p-ok')+'">'+fl.length+'</span></span><span class="hint">'+esc(t.pFlagsH)+'</span></h3>';
    if(fl.length){
      h += fbar("flags", f, { q:true, chips:[ {key:"type", items:FLAGS.filter(function(k){ return flCounts[k]; }).map(function(k){ return [k, t.fl[k], flCounts[k]]; })},
                                                {key:"prod", items:prods(fl, function(c){ return c[2]; })} ], count:[flRows.length, fl.length] });
      flRows.slice(0, f.shown).forEach(function(c){
        h += '<div class="task"><div class="tag">'+esc(c[6])+'</div>'
          + '<div class="st">'+c[7].map(function(k){ return '<span class="pill p-warn">'+esc(t.fl[k])+'</span>'; }).join(' ')+'</div>'
          + '<div class="meta"><span class="pill p-prod">'+esc(prodLabel(c[2]))+'</span></div>'
          + '<div class="items" style="font-size:.8rem;color:var(--ink-2)">'+c[7].map(function(k){ return esc(t.fx[k]); }).join(' ')+'</div></div>';
      });
      if(!flRows.length) h += '<div class="empty">'+esc(t.nothingLeft)+'</div>';
      if(flRows.length > f.shown) h += more("flags", Math.min(SHORT, flRows.length - f.shown), t);
    } else h += '<div class="empty">'+esc(t.noneFlags)+'</div>';
    h += '</div>';

    /* missed: this week and last by default, filter by status / product / cadence / search, short pages */
    f = ui.missed;
    var mBase = f.older ? b.missed : b.missedRecent;
    var mCnt = { missed:0, incomplete:0 }; mBase.forEach(function(x){ mCnt[x.pts === 0 ? "missed" : "incomplete"]++; });
    var cads = {}; mBase.forEach(function(x){ cads[STAGES[x.si]] = 1; });
    var mList = mBase.filter(function(x){ return (!f.status || (x.pts === 0 ? "missed" : "incomplete") === f.status) && (!f.prod || x.c[2] === f.prod) && (!f.cad || STAGES[x.si] === f.cad) && qmatch(f.q, x.c[6]); });
    h += '<div class="panel" id="missed"><h3><span>'+esc(t.pMissed)+' <span class="pill '+(b.missedRecent.length?'p-bad':'p-ok')+'">'+b.missedRecent.length+'</span></span>'
      + '<span class="hint">'+esc(t.pMissedH)+'</span></h3>';
    if(mBase.length){
      h += fbar("missed", f, { q:true, chips:[ {key:"status", items:[["missed", t.stMissed, mCnt.missed], ["incomplete", t.stIncomplete, mCnt.incomplete]]},
                                                {key:"prod", items:prods(mBase, function(x){ return x.c[2]; })} ],
                               select:{key:"cad", label:t.fAllCad, items:STAGES.filter(function(k){ return cads[k]; }).map(function(k){ return [k, k]; })}, count:[mList.length, mBase.length] });
      var grp = "";
      mList.slice(0, f.shown).forEach(function(x){
        var g2 = x.d === addDays(TODAY,-1) ? t.gYesterday : x.d >= b.mon ? t.gThisWeek : x.d >= b.lastMon ? t.gLastWeek : t.gOlder;
        if(g2 !== grp){ grp = g2; h += '<div class="grp">'+esc(g2)+'</div>'; }
        h += taskRow(x, {due:true});
      });
      if(!mList.length) h += '<div class="empty">'+esc(t.nothingLeft)+'</div>';
      if(mList.length > f.shown) h += more("missed", Math.min(SHORT, mList.length - f.shown), t);
      else if(!f.older && b.missedOlder.length) h += '<button class="more" data-older="1">'+esc(fill(t.showOlder, {n:b.missedOlder.length}))+'</button>';
      h += '<div class="tmrw">'+esc(t.missedNote)+'</div>';
    } else if(b.missedOlder.length){
      h += '<div class="empty">'+esc(t.noneMissedRecent)+'</div><button class="more" data-older="1">'+esc(fill(t.showOlder, {n:b.missedOlder.length}))+'</button>';
    } else h += '<div class="empty">'+esc(t.noneMissed)+'</div>';
    h += '</div>';

    /* open queries (ledger, or modelled sample): filter by status / category / search, short pages */
    f = ui.reply;
    var rq = b.replies, liveQ = !!queryRows;
    var qCnt = { open:0, promised:0, chased:0 }, qCats = {}; rq.open.forEach(function(r){ qCnt[r.status]++; qCats[r.cat] = (qCats[r.cat]||0)+1; });
    var qList = rq.open.filter(function(r){ return (!f.status || r.status === f.status) && (!f.cat || r.cat === f.cat) && qmatch(f.q, r.tag + " " + (r.query||"")); });
    h += '<div class="panel" id="reply"><h3><span>'+esc(t.pReply)+' <span class="pill '+(liveQ ? (rq.open.length ? "p-warn" : "p-ok") : "p-mock")+'">'+rq.open.length+'</span></span>'
      + '<span class="hint">'+esc(liveQ ? t.pReplyHLive : t.pReplyH)+'</span></h3>';
    if(rq.open.length){
      h += fbar("reply", f, { q:true, chips:[ {key:"status", items:[["chased", t.qChased, qCnt.chased], ["promised", t.qPromised, qCnt.promised], ["open", t.qOpen, qCnt.open]]},
                                                {key:"cat", items:QCATS.filter(function(k){ return qCats[k]; }).map(function(k){ return [k, t.qCat[k] || k, qCats[k]]; })} ], count:[qList.length, rq.open.length] });
      qList.slice(0, f.shown).forEach(function(r){
        var st = r.status === "chased" ? '<span class="pill p-bad">'+esc(t.qChased)+(r.chased>1?' ×'+r.chased:'')+'</span>'
               : r.status === "promised" ? '<span class="pill p-warn">'+esc(t.qPromised)+'</span>'
               : '<span class="pill p-accent">'+esc(t.qOpen)+'</span>';
        var age = r.hours >= 24 ? "color:var(--bad)" : r.hours >= 4 ? "color:var(--warn)" : "";
        h += '<div class="task"><div class="tag">'+esc(r.tag)+'</div><div class="st">'+st+'</div>'
          + '<div class="meta">'+(r.prod ? '<span class="pill p-prod">'+esc(prodLabel(r.prod))+'</span>' : '')
          + '<span class="pill p-inert">'+esc(t.qCat[r.cat] || r.cat)+'</span>'
          + '<span style="'+age+'">'+esc(fill(t.waiting, {t:waitText(r.hours)}))+'</span></div>'
          + (r.query ? '<div class="items" style="font-size:.84rem;color:var(--ink-2)">'+esc(r.query)+'</div>' : '')+'</div>';
      });
      if(!qList.length) h += '<div class="empty">'+esc(t.nothingLeft)+'</div>';
      if(qList.length > f.shown) h += more("reply", Math.min(SHORT, qList.length - f.shown), t);
    } else h += '<div class="empty">'+esc(t.noneReply)+'</div>';
    h += '<div class="tmrw">'+fill(t.qStats, {r:rq.resolved, m: rq.medianHours === null ? "—" : rq.medianHours, p:rq.promised, c:rq.chased})+'</div>';
    h += '<div class="tmrw">'+t.replyNote+'</div></div>';

    /* ---- then progress: score, days, week, team ---- */

    /* rings + day strip */
    var mA = agg(b.mtd), aA = agg(b.closed);
    var projPts = mA.pts + b.today.length, projDue = mA.due + b.today.length;
    var projPct = pct(projPts, projDue);
    h += '<div class="grid2">';
    h += '<div class="panel" id="progress"><h3><span>'+esc(t.pProgress)+'</span></h3><div class="pad"><div class="rings">'
      + '<div class="rcol">'+ring(b.today.length ? pct(tA.full, b.today.length) : 0, perfect ? 'var(--ok)' : 'var(--accent)',
          b.today.length ? pct(tA.full, b.today.length)+'%' : '—', '', true)
        + '<span class="rl">'+esc(t.rToday)+'</span><span class="rs">'+esc(fill(t.rTodaySub, {n:b.today.length}))+'</span></div>'
      + '<div class="rcol">'+ring(mA.score, mA.due ? scoreColour(mA.score) : 'var(--surface-3)', mA.due ? mA.score+'%' : '—', '', true)
        + '<span class="rl">'+esc(t.rMonth)+'</span><span class="rs">'+esc(fill(t.rSub, {n:mA.due}))+'</span></div>'
      + '<div class="rcol">'+ring(aA.score, aA.due ? scoreColour(aA.score) : 'var(--surface-3)', aA.due ? aA.score+'%' : '—', '', true)
        + '<span class="rl">'+esc(t.rAll)+'</span><span class="rs">'+esc(fill(t.rSub, {n:aA.due}))+'</span></div>'
      + '</div>';
    if(b.today.length && !perfect)
      h += '<p class="proj">'+fill(mA.due && mA.score >= TARGET ? t.projMet : t.proj, {n:b.today.length - tA.full, p:projPct})+'</p>';
    h += '<p style="margin:12px 0 0;font-size:.78rem;color:var(--muted)">'+esc(t.pProgressH)+'</p></div></div>';

    /* day strip */
    var y = +b.curM.slice(0,4), m = +b.curM.slice(5,7), nDays = new Date(Date.UTC(y, m, 0)).getUTCDate();
    h += '<div class="panel" id="days"><h3><span>'+esc(t.pDays)+'</span><span class="hint">'+esc(t.pDaysH)+'</span></h3><div class="pad"><div class="strip">';
    for(var i=1;i<=nDays;i++){
      var dk = b.curM + "-" + String(i).padStart(2,"0"), cls, title;
      if(dk < TODAY){ var s = b.dayScore(dk); cls = s === null ? "none" : scoreClass(s); title = s === null ? "" : s + "%"; }
      else if(dk === TODAY){ cls = "today " + (b.today.length ? (perfect ? "ok" : "none") : "none"); title = b.today.length ? pct(tA.full, b.today.length)+"%" : ""; }
      else cls = "future";
      if(dk < START) cls = "none";
      h += '<span class="dsq '+cls+'" title="'+esc(dk + (title ? " · " + title : ""))+'">'+i+'</span>';
    }
    h += '</div><div class="legend"><span><i style="background:var(--ok)"></i>'+esc(t.legOk)+'</span>'
      + '<span><i style="background:var(--warn)"></i>'+esc(t.legWarn)+'</span>'
      + '<span><i style="background:var(--bad)"></i>'+esc(t.legBad)+'</span>'
      + '<span><i style="background:var(--surface-2);border:1px solid var(--rule)"></i>'+esc(t.legNone)+'</span>'
      + '<span><i style="border:1px dashed var(--rule)"></i>'+esc(t.legFuture)+'</span></div>';
    h += '<div class="badges">'
      + '<div class="badge fire"><div class="bn">'+(b.streak ? '🔥 ' : '')+b.streak+'</div><div class="bl">'+esc(t.streakCur)+' · '+esc(fill(t.streakUnit, {t:TARGET}))+'</div></div>'
      + '<div class="badge"><div class="bn">'+b.best+'</div><div class="bl">'+esc(t.streakBest)+'</div></div>'
      + '<div class="badge star"><div class="bn">'+(b.perfect ? '★ ' : '')+b.perfect+'</div><div class="bl">'+esc(t.perfectDays)+' · '+esc(t.perfectUnit)+'</div></div>'
      + '</div></div></div>';
    h += '</div>';

    /* week */
    var wkByDay = {}; b.week.forEach(function(x){ (wkByDay[x.d] = wkByDay[x.d] || []).push(x); });
    h += '<div class="panel" id="week"><h3><span>'+esc(t.pWeek)+'</span><span class="hint">'+esc(fill(t.pWeekH, {a:fmtDay(b.mon), b:fmtDay(b.sun)}))+'</span></h3><div class="pad">'
      + '<div class="wksum">'+fill(t.wkSum, {n:b.week.length, c:wClosed, t:b.today.length, f:wFuture})+'</div><div class="wk">';
    var wkMax = 1; Object.keys(wkByDay).forEach(function(k){ wkMax = Math.max(wkMax, wkByDay[k].length); });
    for(var wi=0; wi<7; wi++){
      var dk2 = addDays(b.mon, wi), list = wkByDay[dk2] || [], g = agg(list), future = dk2 > TODAY, isT = dk2 === TODAY;
      var hgt = list.length ? Math.max(6, Math.round(list.length / wkMax * 64)) : 0;
      h += '<div class="wd'+(future?' future':'')+(isT?' today':'')+'"><span class="wl">'+esc(t.days[wi])+' '+(+dk2.slice(8,10))+'</span>'
        + '<span class="wn">'+(list.length || '·')+'</span><div class="wbar">';
      if(list.length){
        if(future) h += '<span style="height:'+hgt+'px;background:var(--surface-3)"></span>';
        else {
          h += '<span style="height:'+Math.round(hgt*g.miss/list.length)+'px;background:var(--bad)"></span>'
            + '<span style="height:'+Math.round(hgt*g.part/list.length)+'px;background:var(--warn)"></span>'
            + '<span style="height:'+Math.round(hgt*g.full/list.length)+'px;background:var(--ok)"></span>';
        }
      }
      h += '</div><span class="ws">'+(list.length && !future ? g.score+'%' : (list.length ? esc(t.wkDue) : ''))+'</span></div>';
    }
    h += '</div><p style="margin:12px 0 0;font-size:.78rem;color:var(--muted)">'+esc(t.wkNote)+'</p></div></div>';

    /* team */
    var team = {};
    instancesOf(CASES).forEach(function(x){
      if(x.d >= TODAY || x.d.slice(0,7) !== b.curM) return;
      var k = daKey(x.c); (team[k] = team[k] || []).push(x);
    });
    var trows = Object.keys(team).map(function(k){ var g = agg(team[k]); g.k = k; return g; })
      .sort(function(p,q){ return q.score - p.score || q.due - p.due; });
    var myRank = 0; trows.forEach(function(r, i){ if(r.k === me) myRank = i+1; });
    h += '<div class="panel" id="team"><h3><span>'+esc(t.pTeam)+'</span><span class="hint">'+esc(t.pTeamH)+'</span></h3>'
      + '<div style="overflow-x:auto"><table><thead><tr><th>'+esc(t.thDA)+'</th><th>'+esc(t.thClinic)+'</th><th class="n">'+esc(t.thScore)+'</th>'
      + '<th style="width:26%"></th><th class="n">'+esc(t.thDue)+'</th><th class="n">'+esc(t.thMissed)+'</th></tr></thead><tbody>';
    trows.forEach(function(r, i){
      h += '<tr'+(r.k===me?' class="me"':'')+'><td><span class="rank">#'+(i+1)+'</span> '+esc(daName(r.k))+'</td>'
        + '<td style="color:var(--muted)">'+esc(daClinic(r.k))+'</td>'
        + '<td class="n" style="color:'+scoreColour(r.score)+'">'+r.score+'%</td>'
        + '<td><div class="barw"><div class="barf" style="width:'+Math.max(r.score,1)+'%;background:'+scoreColour(r.score)+'"></div>'
        + '<div class="bart" style="left:'+TARGET+'%"></div></div></td>'
        + '<td class="n">'+r.due+'</td><td class="n">'+r.miss+'</td></tr>';
    });
    h += '</tbody></table></div>'
      + (myRank ? '<div class="tmrw">'+esc(fill(t.rank, {r:myRank, n:trows.length}))+'</div>' : '')+'</div>';


    /* footer */
    h += '<p class="foot">'+fill(t.foot, {src: feedState.mode === "live"
      ? fill(t.srcLive, {t:fmtWhen(feedState.at)}) : fill(t.srcSnap, {t:fmtWhen(feedState.at)})})+'</p>';

    document.getElementById("app").innerHTML = h;
    wire();
  }
  function tile(href, cls, n, label, sub){
    return '<a class="stat '+cls+'" href="'+href+'" style="text-decoration:none"><span class="sn">'+n+'</span>'
      + '<span class="sl">'+esc(label)+'</span><span class="sx">'+esc(sub)+'</span></a>';
  }
  function fbar(id, f, o){
    var t = T(), h = '<div class="fbar">';
    if(o.q) h += '<input type="search" data-fq="'+id+'" placeholder="'+esc(t.fSearch)+'" value="'+esc(f.q)+'">';
    (o.chips || []).forEach(function(g, gi){
      if(!g.items.length) return;
      if(gi || o.q) h += '<span class="sep"></span>';
      g.items.forEach(function(it){
        h += '<button data-fk="'+id+'" data-key="'+g.key+'" data-val="'+esc(it[0])+'" aria-pressed="'+(f[g.key]===it[0])+'">'+esc(it[1])+(it[2] !== undefined ? ' <span class="cn">'+it[2]+'</span>' : '')+'</button>';
      });
    });
    if(o.select && o.select.items.length){
      h += '<select data-fs="'+id+'" data-key="'+o.select.key+'"><option value="">'+esc(o.select.label)+'</option>'
        + o.select.items.map(function(it){ return '<option value="'+esc(it[0])+'"'+(f[o.select.key]===it[0]?' selected':'')+'>'+esc(it[1])+'</option>'; }).join('')+'</select>';
    }
    if(o.count) h += '<span class="cnt">'+esc(fill(t.fShowing, {a:o.count[0], b:o.count[1]}))+'</span>';
    return h + '</div>';
  }
  function more(id, n, t){ return '<button class="more" data-more="'+id+'">'+esc(fill(t.showMore, {n:n}))+'</button>'; }
  function wire(){
    document.querySelectorAll("[data-fq]").forEach(function(el){
      el.oninput = function(){ var f = ui[el.dataset.fq]; f.q = el.value; if(f.shown !== undefined) f.shown = SHORT; render();
        var q = document.querySelector('[data-fq="'+el.dataset.fq+'"]'); if(q){ q.focus(); q.setSelectionRange(q.value.length, q.value.length); } };
    });
    document.querySelectorAll("[data-fk]").forEach(function(el){
      el.onclick = function(){ var f = ui[el.dataset.fk], k = el.dataset.key; f[k] = (f[k] === el.dataset.val) ? "" : el.dataset.val; if(f.shown !== undefined) f.shown = SHORT; render(); };
    });
    document.querySelectorAll("[data-fs]").forEach(function(el){
      el.onchange = function(){ var f = ui[el.dataset.fs]; f[el.dataset.key] = el.value; if(f.shown !== undefined) f.shown = SHORT; render(); };
    });
    document.querySelectorAll("[data-more]").forEach(function(el){
      el.onclick = function(){ ui[el.dataset.more].shown += SHORT; render(); };
    });
    document.querySelectorAll("[data-older]").forEach(function(el){
      el.onclick = function(){ ui.missed.older = true; ui.missed.shown = SHORT; render(); };
    });
  }

  /* ================= shell ================= */
  SHELL.init({ page:"sop", root:"../", onRender:function(st){
    lang = st.lang; me = st.me; CASES = st.cases; feedState = st.feed; render();
  }});
  loadQueries().then(function(ok){
    if(ok && SHELL.state.session && !document.getElementById("wrap").hidden) SHELL.render();
  });
})();
</script>
